name: Windows package

# Builds the portable Windows package (LK Companion + its own Node.js + launcher), starts it on
# a Windows machine to check it works, and publishes it as a download on the run's page
# ("Artifacts" → LK-Companion-Windows). Runs on every push to main or a claude/ branch, and
# on demand from the Actions tab. Built from a fresh checkout: no keys or local data exist here.

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:
    inputs:
      release:
        description: Also publish it as a GitHub release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm run check

  package:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - name: Build the package
        run: node scripts/package-windows.mjs
      - name: Start the packaged app on Windows and check it answers
        shell: pwsh
        run: |
          $pkg = Join-Path $env:RUNNER_TEMP 'pkg'
          Expand-Archive -Path (Get-ChildItem dist\*.zip).FullName -DestinationPath $pkg
          ./scripts/smoke-test.ps1 -App (Join-Path $pkg 'LK Companion') -DataHome (Join-Path $env:RUNNER_TEMP 'lkc-home')
      - name: Publish the package as a download
        uses: actions/upload-artifact@v4
        with:
          name: LK-Companion-Windows
          path: dist/LK Companion/
          # The built app lives in app/.next, which the upload skips unless hidden files are
          # included. (The package never contains .env files: the build script removes them.)
          include-hidden-files: true
          retention-days: 90
      - name: Publish a release (only when asked)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version-build$env:GITHUB_RUN_NUMBER"
          gh release create $tag (Get-ChildItem dist\*.zip).FullName --target $env:GITHUB_SHA --title "LK Companion $version (build $env:GITHUB_RUN_NUMBER)" --notes "Windows package. Unzip it and double-click 'Start LK Companion'. See 'READ ME FIRST.txt' inside."

  # Downloads the published artifact exactly as you would, and starts the app from it.
  check-download:
    needs: package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/download-artifact@v4
        with:
          name: LK-Companion-Windows
          path: ${{ runner.temp }}\download
      - name: Start the downloaded app and check it answers
        shell: pwsh
        run: ./scripts/smoke-test.ps1 -App (Join-Path $env:RUNNER_TEMP 'download') -DataHome (Join-Path $env:RUNNER_TEMP 'lkc-home')
